<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromoTechBR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}

header{
    background:#111827;
    padding:15px;
    position:sticky;
    top:0;
}

.logo{
    font-size:28px;
    font-weight:bold;
    text-align:center;
    color:#fbbf24;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    border-radius:12px;
    padding:15px;
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
    border-radius:10px;
}

.card h3{
    margin:10px 0;
}

.price{
    color:#fbbf24;
    font-size:22px;
    font-weight:bold;
}

.btn{
    display:block;
    text-align:center;
    background:#fbbf24;
    color:black;
    text-decoration:none;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    font-weight:bold;
}

.review-box{
    margin-top:50px;
    background:#1e293b;
    padding:20px;
    border-radius:12px;
}

input,textarea,select{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

button{
    margin-top:10px;
    padding:12px;
    width:100%;
    border:none;
    border-radius:8px;
    background:#fbbf24;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>
<body>

<header>
<div class="logo">PromoTechBR</div>
</header>

<div class="container">

<h2>Produtos em Destaque</h2>

<div id="products" class="products"></div>

<div class="review-box">
<h2>Avalie Nossa Loja</h2>

<select id="stars">
<option value="5">⭐⭐⭐⭐⭐</option>
<option value="4">⭐⭐⭐⭐</option>
<option value="3">⭐⭐⭐</option>
<option value="2">⭐⭐</option>
<option value="1">⭐</option>
</select>

<textarea id="comment" placeholder="Conte sua experiência"></textarea>

<button onclick="saveReview()">
Enviar Avaliação
</button>

<div id="reviews"></div>
</div>

</div>

<script>
function loadProducts(){

const products =
JSON.parse(localStorage.getItem("products")) || [];

const container =
document.getElementById("products");

if(products.length === 0){
container.innerHTML =
"<p>Nenhum produto cadastrado.</p>";
return;
}

container.innerHTML = products.map(product => `
<div class="card">

<img src="${product.imageUrl}" alt="${product.name}">

<h3>${product.name}</h3>

<div class="price">
R$ ${Number(product.price).toFixed(2)}
</div>

<a href="${product.affiliateLink}"
target="_blank"
class="btn">
Ver Oferta
</a>

</div>
`).join("");

}

function saveReview(){

const reviews =
JSON.parse(localStorage.getItem("siteReviews")) || [];

reviews.push({
stars: document.getElementById("stars").value,
comment: document.getElementById("comment").value
});

localStorage.setItem(
"siteReviews",
JSON.stringify(reviews)
);

renderReviews();

document.getElementById("comment").value = "";
}

function renderReviews(){

const reviews =
JSON.parse(localStorage.getItem("siteReviews")) || [];

document.getElementById("reviews").innerHTML =
reviews.map(r => `
<hr>
<p>${"⭐".repeat(r.stars)}</p>
<p>${r.comment}</p>
`).join("");

}

loadProducts();
renderReviews();
</script>

</body>
</html>
