<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Affiliate Store Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, rgb(13, 0, 26) 0%, rgb(5, 5, 20) 50%, rgb(0, 13, 26) 100%);
            color: #f5e6ff;
            line-height: 1.6;
        }

        .grid-background {
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        /* Header */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(236, 72, 153, 0.2);
            z-index: 50;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
            padding: 0 1rem;
            max-width: 1280px;
            margin: 0 auto;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.25rem;
            font-weight: bold;
        }

        .logo-icon {
            width: 24px;
            height: 24px;
            color: #22d3ee;
        }

        .neon-text {
            font-weight: 700;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            font-weight: 700;
            color: white;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-neon {
            background: linear-gradient(135deg, rgb(219, 39, 119) 0%, rgb(236, 72, 153) 100%);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        .btn-neon:hover {
            background: linear-gradient(135deg, rgb(236, 72, 153) 0%, rgb(244, 114, 182) 100%);
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.8), 0 0 60px rgba(255, 0, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(100, 100, 100, 0.5);
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(150, 100, 100, 0.5);
        }

        .btn-danger {
            background: rgba(220, 38, 38, 0.5);
            border: 1px solid rgba(220, 38, 38, 0.7);
            font-size: 0.75rem;
            padding: 0.5rem 1rem;
        }

        .btn-danger:hover {
            background: rgba(220, 38, 38, 0.8);
        }

        .btn-small {
            font-size: 0.75rem;
            padding: 0.5rem 1rem;
        }

        /* Main Content */
        main {
            margin-top: 80px;
        }

        .page-title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 2rem;
        }

        /* Products Table */
        .products-section {
            background: linear-gradient(135deg, rgb(30, 41, 59) 0%, rgb(15, 23, 42) 100%);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 0.75rem;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(0, 0, 0, 0.3);
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(236, 72, 153, 0.2);
            font-weight: 600;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid rgba(236, 72, 153, 0.1);
        }

        tr:hover {
            background: rgba(236, 72, 153, 0.05);
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #9ca3af;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgb(30, 41, 59) 0%, rgb(15, 23, 42) 100%);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 0.75rem;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-title {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .close-btn {
            background: none;
            border: none;
            color: #f5e6ff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        input, textarea {
            width: 100%;
            padding: 0.75rem;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(236, 72, 153, 0.3);
            border-radius: 0.5rem;
            color: #f5e6ff;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: rgba(236, 72, 153, 0.8);
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
            margin-top: 2rem;
        }

        /* Alert */
        .alert {
            padding: 1rem;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
            display: none;
        }

        .alert.active {
            display: block;
        }

        .alert-success {
            background: rgba(34, 211, 238, 0.2);
            border: 1px solid rgba(34, 211, 238, 0.5);
            color: #22d3ee;
        }

        .alert-error {
            background: rgba(220, 38, 38, 0.2);
            border: 1px solid rgba(220, 38, 38, 0.5);
            color: #ff6b6b;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 32px;
            height: 32px;
            border: 3px solid rgba(34, 211, 238, 0.3);
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            table {
                font-size: 0.875rem;
            }

            th, td {
                padding: 0.5rem;
            }

            .product-actions {
                flex-direction: column;
            }

            .modal-content {
                width: 95%;
                padding: 1rem;
            }
        }
    </style>
</head>
<body class="grid-background">
    <!-- Header -->
    <header>
        <div class="header-content">
            <div class="logo">
                <svg class="logo-icon" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                </svg>
                <span class="neon-text">AFFILIATE PRO - ADMIN</span>
            </div>

            <div class="header-buttons">
                <a href="index.html" class="btn btn-secondary btn-small">Voltar</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container">
            <h1 class="page-title">Gerenciador de Produtos</h1>

            <!-- Alert -->
            <div class="alert" id="alert"></div>

            <!-- Products Section -->
            <div class="products-section">
                <div class="section-header">
                    <h2 class="section-title">Produtos Cadastrados</h2>
                    <button class="btn btn-neon btn-small" onclick="openAddModal()">+ Novo Produto</button>
                </div>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                </div>

                <table id="productsTable" style="display: none;">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Preço</th>
                            <th>Descrição</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody">
                    </tbody>
                </table>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <p>Nenhum produto cadastrado. Clique em "+ Novo Produto" para começar.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Novo Produto</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>

            <form id="productForm" onsubmit="saveProduct(event)">
                <div class="form-group">
                    <label for="name">Nome do Produto *</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="price">Preço (R$) *</label>
                    <input type="number" id="price" step="0.01" required>
                </div>

                <div class="form-group">
                    <label for="description">Descrição *</label>
                    <textarea id="description" required></textarea>
                </div>

                <div class="form-group">
                    <label for="shortDescription">Descrição Curta</label>
                    <input type="text" id="shortDescription">
                </div>

                <div class="form-group">
                    <label for="imageUrl">URL da Imagem *</label>
                    <input type="url" id="imageUrl" required>
                </div>

                <div class="form-group">
                    <label for="affiliateLink">Link de Afiliado *</label>
                    <input type="url" id="affiliateLink" required>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-neon">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let currentEditId = null;

        // Carregar produtos
        async function loadProducts() {
            const loading = document.getElementById('loading');
            const table = document.getElementById('productsTable');
            const tbody = document.getElementById('productsBody');
            const emptyState = document.getElementById('emptyState');

            loading.classList.add('active');

            try {
                const response = await fetch('/api/products');
                const products = await response.json();

                loading.classList.remove('active');

                if (!products || products.length === 0) {
                    table.style.display = 'none';
                    emptyState.style.display = 'block';
                    return;
                }

                table.style.display = 'table';
                emptyState.style.display = 'none';

                tbody.innerHTML = products.map(product => `
                    <tr>
                        <td>${product.name}</td>
                        <td>R$ ${parseFloat(product.price).toFixed(2)}</td>
                        <td>${product.description.substring(0, 50)}...</td>
                        <td>
                            <div class="product-actions">
                                <button class="btn btn-neon btn-small" onclick="editProduct(${product.id})">Editar</button>
                                <button class="btn btn-danger" onclick="deleteProduct(${product.id})">Deletar</button>
                            </div>
                        </td>
                    </tr>
                `).join('');
            } catch (error) {
                console.error('Erro ao carregar produtos:', error);
                loading.classList.remove('active');
                showAlert('Erro ao carregar produtos', 'error');
            }
        }

        // Abrir modal para novo produto
        function openAddModal() {
            currentEditId = null;
            document.getElementById('modalTitle').textContent = 'Novo Produto';
            document.getElementById('productForm').reset();
            document.getElementById('modal').classList.add('active');
        }

        // Editar produto
        async function editProduct(id) {
            try {
                const response = await fetch(`/api/products/${id}`);
                const product = await response.json();

                currentEditId = id;
                document.getElementById('modalTitle').textContent = 'Editar Produto';
                document.getElementById('name').value = product.name;
                document.getElementById('price').value = product.price;
                document.getElementById('description').value = product.description;
                document.getElementById('shortDescription').value = product.shortDescription || '';
                document.getElementById('imageUrl').value = product.imageUrl;
                document.getElementById('affiliateLink').value = product.affiliateLink;
                document.getElementById('modal').classList.add('active');
            } catch (error) {
                console.error('Erro ao carregar produto:', error);
                showAlert('Erro ao carregar produto', 'error');
            }
        }

        // Salvar produto
        async function saveProduct(event) {
            event.preventDefault();

            const data = {
                name: document.getElementById('name').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                shortDescription: document.getElementById('shortDescription').value,
                imageUrl: document.getElementById('imageUrl').value,
                affiliateLink: document.getElementById('affiliateLink').value,
            };

            try {
                const url = currentEditId ? `/api/products/${currentEditId}` : '/api/products';
                const method = currentEditId ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error('Erro ao salvar produto');
                }

                showAlert(
                    currentEditId ? 'Produto atualizado com sucesso!' : 'Produto criado com sucesso!',
                    'success'
                );
                closeModal();
                loadProducts();
            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao salvar produto', 'error');
            }
        }

        // Deletar produto
        async function deleteProduct(id) {
            if (!confirm('Tem certeza que deseja deletar este produto?')) return;

            try {
                const response = await fetch(`/api/products/${id}`, { method: 'DELETE' });

                if (!response.ok) {
                    throw new Error('Erro ao deletar produto');
                }

                showAlert('Produto deletado com sucesso!', 'success');
                loadProducts();
            } catch (error) {
                console.error('Erro:', error);
                showAlert('Erro ao deletar produto', 'error');
            }
        }

        // Fechar modal
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentEditId = null;
        }

        // Mostrar alerta
        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert active alert-${type}`;
            setTimeout(() => alert.classList.remove('active'), 3000);
        }

        // Carregar produtos ao iniciar
        loadProducts();
    </script>
</body>
</html>
