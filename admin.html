<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - PromoShopeeBR</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;

}

input,textarea,select{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.btn{
background:#fbbf24;
color:black;
width:100%;
}

.btn-delete{
background:red;
color:white;
}

.product{
background:#334155;
padding:15px;
border-radius:10px;
margin-top:10px;
}

img{
max-width:100px;
border-radius:8px;
}
</style>
</head>
<body>

<div id="login" class="card">

<h2>Login Admin</h2>

<input type="password" id="password" placeholder="Senha">

<button class="btn" onclick="login()">Entrar</button>

</div>

<div id="adminPanel" style="display:none;">

<div class="card">

<h2>Novo Produto</h2>

<input type="text" id="name" placeholder="Nome do produto">

<input type="number" id="price" placeholder="Preço">

<select id="category">
<option value="eletronicos">📱 Eletrônicos</option>
<option value="casa">🏠 Casa e Cozinha</option>
<option value="informatica">💻 Informática</option>
<option value="games">🎮 Games</option>
<option value="moda">👕 Moda</option>
<option value="beleza">💄 Beleza</option>
<option value="saude">❤️ Saúde</option>
<option value="esportes">⚽ Esportes</option>
<option value="automotivo">🚗 Automotivo</option>
<option value="ferramentas">🔧 Ferramentas</option>
<option value="petshop">🐶 Pet Shop</option>
<option value="brinquedos">🧸 Brinquedos</option>
<option value="livros">📚 Livros</option>
<option value="bebe">👶 Bebê</option>
<option value="papelaria">✏️ Papelaria</option>
</select>

<input type="file" id="imageFile" accept="image/*">

<input type="url" id="affiliateLink" placeholder="Link de afiliado">

<button class="btn" onclick="saveProduct()">Salvar Produto</button>

</div>

<div class="card">
<h2>Produtos Cadastrados</h2>
<div id="products"></div>
</div>

<div class="card">
<h2>Avaliações da Loja</h2>
<div id="reviews"></div>
</div>

</div>

<script>

const ADMIN_PASSWORD="vendas986";

function login(){

const password=document.getElementById("password").value;

if(password===ADMIN_PASSWORD){

document.getElementById("login").style.display="none";
document.getElementById("adminPanel").style.display="block";

loadProducts();
loadReviews();

}else{

alert("Senha incorreta");

}

}

function saveProduct(){}

function loadProducts(){}

function editProduct(id){}

function deleteProduct(id){}

function loadReviews(){

const reviews=JSON.parse(localStorage.getItem("siteReviews")) || [];

document.getElementById("reviews").innerHTML=reviews.map((review,index)=>`

<div class="product">

<p>${"⭐".repeat(review.stars)}</p>

<p>${review.comment}</p>

<button class="btn-delete" onclick="deleteReview(${index})">Excluir Avaliação</button>

</div>

`).join("");

}

function deleteReview(index){

let reviews=JSON.parse(localStorage.getItem("siteReviews")) || [];

reviews.splice(index,1);

localStorage.setItem("siteReviews",JSON.stringify(reviews));

loadReviews();

}

</script>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-analytics.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBYxwVTgxvhCd_HX5TCYrmApabcA0QcheI",
  authDomain: "promo-shopeebr.firebaseapp.com",
  projectId: "promo-shopeebr",
  storageBucket: "promo-shopeebr.firebasestorage.app",
  messagingSenderId: "58982670650",
  appId: "1:58982670650:web:db7743800ef97e1ef7b003",
  measurementId: "G-ZHGMD1VS2F"
};

const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
window.db = getFirestore(app);



window.saveProduct = async function(){
const file=document.getElementById("imageFile").files[0];
if(!file){alert("Selecione uma imagem");return;}
const reader=new FileReader();
reader.onload=async function(e){
await addDoc(collection(window.db,"products"),{
name:document.getElementById("name").value,
price:document.getElementById("price").value,
category:document.getElementById("category").value,
imageUrl:e.target.result,
affiliateLink:document.getElementById("affiliateLink").value
});
loadProducts();
alert("Produto salvo.");
};
reader.readAsDataURL(file);
}

window.loadProducts = async function(){
const snap=await getDocs(collection(window.db,"products"));
let html="";
snap.forEach(item=>{
const product=item.data();
html+=`<div class="product">
<img src="${product.imageUrl}">
<h3>${product.name}</h3>
<p>R$ ${product.price}</p>
<p>${product.category||""}</p>
<button class="btn-delete" onclick="deleteProduct('${item.id}')">Excluir</button>
<button class="btn" onclick="editProduct('${item.id}')">Editar</button>
</div>`;
});
document.getElementById("products").innerHTML=html;
}

window.deleteProduct=async function(id){
await deleteDoc(doc(window.db,'products',id));
loadProducts();
}

window.editProduct=async function(id){
const snap=await getDocs(collection(window.db,'products'));
let produto=null;
snap.forEach(x=>{if(x.id===id) produto=x.data();});
if(!produto) return;
await updateDoc(doc(window.db,'products',id),{
name:prompt('Nome:',produto.name),
price:prompt('Preço:',produto.price),
category:prompt('Categoria:',produto.category),
affiliateLink:prompt('Link:',produto.affiliateLink)
});
loadProducts();
}

</script>

</body>
</html>
