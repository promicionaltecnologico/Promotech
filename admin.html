<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - PromoShopeeBR</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
padding:20px;
}

.container{
max-width:1000px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

input,textarea{
width:100%;
padding:10px;
margin-top:10px;
border:none;
border-radius:8px;
}

button{
padding:12px;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
margin-top:10px;
}

.btn{
background:#fbbf24;
color:black;
width:100%;
}

.btn-delete{
background:red;
color:white;
}

.product{
background:#334155;
padding:15px;
border-radius:10px;
margin-top:10px;
}

img{
max-width:100px;
border-radius:8px;
}
</style>
</head>
<body>

<div id="login" class="card">
<h2>Login Admin</h2>

<input
type="password"
id="password"
placeholder="Senha">

<button
class="btn"
onclick="login()">
Entrar
</button>
</div>

<div
id="adminPanel"
style="display:none;">

<div class="card">

<h2>Novo Produto</h2>

<input
type="text"
id="name"
placeholder="Nome do produto">

<input
type="number"
id="price"
placeholder="Preço">

<input
type="file"
id="imageFile"
accept="image/*">

<input
type="url"
id="affiliateLink"
placeholder="Link de afiliado">

<button
class="btn"
onclick="saveProduct()">
Salvar Produto
</button>

</div>

<div class="card">
<h2>Produtos Cadastrados</h2>

<div id="products"></div>
</div>

<div class="card">
<h2>Avaliações da Loja</h2>

<div id="reviews"></div>
</div>

</div>

<script>

const ADMIN_PASSWORD = "vendas986";

function login(){

const password =
document.getElementById("password").value;

if(password === ADMIN_PASSWORD){

document.getElementById("login").style.display="none";
document.getElementById("adminPanel").style.display="block";

loadProducts();
loadReviews();

}else{

alert("Senha incorreta");

}

}

function saveProduct(){

const file =
document.getElementById("imageFile").files[0];

if(!file){
alert("Selecione uma imagem");
return;
}

const reader = new FileReader();

reader.onload = function(e){

const products =
JSON.parse(localStorage.getItem("products")) || [];

products.push({
id: Date.now(),
name: document.getElementById("name").value,
price: document.getElementById("price").value,
imageUrl: e.target.result,
affiliateLink:
document.getElementById("affiliateLink").value
});

localStorage.setItem(
"products",
JSON.stringify(products)
);

loadProducts();

alert("Produto salvo");

};

reader.readAsDataURL(file);

}

function loadProducts(){

const products =
JSON.parse(localStorage.getItem("products")) || [];

document.getElementById("products").innerHTML =
products.map(product => `

<div class="product">

<img src="${product.imageUrl}">

<h3>${product.name}</h3>

<p>R$ ${product.price}</p>

<button
class="btn-delete"
onclick="deleteProduct(${product.id})">
Excluir
</button>

<button
class="btn"
onclick="editProduct(${product.id})">
Editar
</button>

</div>

`).join("");

}

function deleteProduct(id){

let products =
JSON.parse(localStorage.getItem("products")) || [];

products =
products.filter(
product => product.id !== id
);

localStorage.setItem(
"products",
JSON.stringify(products)
);

loadProducts();

}


function editProduct(id){

let products =
JSON.parse(localStorage.getItem("products")) || [];

const product =
products.find(p => p.id === id);

if(!product) return;

const novoNome =
prompt("Nome:", product.name);

const novoPreco =
prompt("Preço:", product.price);

const novaCategoria =
prompt("Categoria:", product.category || "eletronicos");

const novoLink =
prompt("Link de afiliado:", product.affiliateLink);

product.name = novoNome;
product.price = novoPreco;
product.category = novaCategoria;
product.affiliateLink = novoLink;

localStorage.setItem(
"products",
JSON.stringify(products)
);

loadProducts();

alert("Produto atualizado!");

}

function loadReviews(){

const reviews =
JSON.parse(localStorage.getItem("siteReviews")) || [];

document.getElementById("reviews").innerHTML =
reviews.map((review,index)=>`

<div class="product">

<p>${"⭐".repeat(review.stars)}</p>

<p>${review.comment}</p>

<button
class="btn-delete"
onclick="deleteReview(${index})">
Excluir Avaliação
</button>

</div>

`).join("");

}

function deleteReview(index){

let reviews =
JSON.parse(localStorage.getItem("siteReviews")) || [];

reviews.splice(index,1);

localStorage.setItem(
"siteReviews",
JSON.stringify(reviews)
);

loadReviews();

}

</script>

</body>
</html>
